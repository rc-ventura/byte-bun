<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8"/>
    <title>Byte & Bun</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
     <h1>Bem vindo a Byte & Bun</h1>

     <section>
        <h2>Exercicio 1 - Console</h2>
        <p class="explicacao"> Sem elemento visual: confira a aba do console F12 ao carregar a pagina</p>

     </section>

     <section>
        <h2>Exercicio 2 - Mudando o texto da pagina</h2>
        <button id="btnSaudacao">Entrar</button>
        <p id="mensagem"></p>
     </section>

     <section>
      <h2>Exercicio 3 - Exibindo um preco do cardapio</h2>
      <button id="btnFrances">Frances</button>
      <button id="btnIntegral">Integral</button>
      <button id="btnCiabatta">Ciabatta</button>
      <p id="resultado"></p>

     </section>

     <section>
      <h2>Exercicio 4 - Lendo um valor digitado</h2>
      <input   type="number" id="quantidade" min="0" placeholder="Digite a quantidade"     />
      <button id="btnCalcular">Calcular</button>
      <p id="total"></p> 
    </section>
     
    <script src="script.js"> </script>
  </body>
  </html>
